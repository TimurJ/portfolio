<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tile/letter colors mirror the ink/bg tokens in src/styles/global.css.
       Safari ignores media queries in favicon SVGs and always shows the light
       variant; favicon.ico and apple-touch-icon.png are rasterized from it. -->
  <style>
    .tile { fill: #1c1c1c; }
    .mark { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ededed; }
      .mark { fill: #0e0e0e; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <text
    class="mark"
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Archivo, ui-sans-serif, system-ui, sans-serif"
    font-size="30"
    font-weight="600"
    letter-spacing="-1"
  >TJ</text>
</svg>
