name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseding a running PR check is the point of this block; superseding a
# running deploy is not, and the last step of this job deploys. Scoping the
# cancel to pull_request means two quick pushes to main queue instead of the
# second killing the first mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # --only-shell because the suite runs headless, and a headless chromium
      # launch runs chrome-headless-shell — without the flag the default also
      # pulls the full Chrome for Testing build, which nothing here launches.
      # Drop it if a debugging session ever needs headless:false or
      # channel:"chromium". Not cached either: the shell downloads in about
      # what an actions/cache round-trip costs, and --with-deps has to run
      # regardless because the system libraries aren't in the cache.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # playwright.config.ts sets trace: "on-first-retry" for CI, which is only
      # worth anything if the zip outlives the runner. !cancelled() rather than
      # failure() so a flaky pass — the case that setting exists for — keeps
      # its trace too.
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      # Only a green main deploys, and from this job so it ships the dist/ the
      # gates above just ran against. `pnpm exec wrangler deploy`, not
      # `pnpm run deploy`: that script rebuilds first.
      #
      # Without a TTY wrangler overrides conflicting Custom Domain and DNS
      # records instead of prompting, so this step can rewrite production DNS
      # silently. docs/deploying.md covers why, and why it is a step.
      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
