name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # --only-shell because the suite runs headless, and a headless chromium
      # launch runs chrome-headless-shell — without the flag the default also
      # pulls the full Chrome for Testing build, which nothing here launches.
      # Drop it if a debugging session ever needs headless:false or
      # channel:"chromium". Not cached either: the shell downloads in about
      # what an actions/cache round-trip costs, and --with-deps has to run
      # regardless because the system libraries aren't in the cache.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # playwright.config.ts sets trace: "on-first-retry" for CI, which is only
      # worth anything if the zip outlives the runner. !cancelled() rather than
      # failure() so a flaky pass — the case that setting exists for — keeps
      # its trace too.
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
